name: Mac release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mac — release build + dmg
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Test
        working-directory: apps/mac
        run: swift test

      - name: Release build
        working-directory: apps/mac
        run: swift build -c release

      - name: Generate icon
        run: scripts/generate-app-icon.sh

      - name: Bundle .app
        run: scripts/bundle-mac-app.sh

      - name: Create DMG
        run: scripts/create-dmg.sh

      # Signing and notarization require CI secrets — see docs/11-packaging-and-updates.md
      # - run: codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" apps/mac/XBot.app
      # - run: xcrun notarytool submit dist/xBot.dmg --wait --apple-id ... --team-id ... --password ...

      - uses: actions/upload-artifact@v4
        with:
          name: xbot-dmg
          path: dist/xBot.dmg
