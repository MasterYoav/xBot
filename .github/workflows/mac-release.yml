name: Mac release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: mac — release build + dmg
    # macos-26, not macos-15: xBot.icon is Icon Composer's format and only Xcode 26's actool can
    # compile it. On the older image the step ran and reported "actool did not produce Assets.car",
    # and the Swift build then failed on the resources Package.swift declares.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # First: the icon is a build input, not a packaging step. Package.swift declares the
      # compiled artifacts as resources, so neither the test nor the build can run without them.
      - name: Generate icon
        run: scripts/generate-app-icon.sh

      - name: Test
        working-directory: apps/mac
        run: swift test

      - name: Release build
        working-directory: apps/mac
        run: swift build -c release

      - name: Bundle .app
        run: scripts/bundle-mac-app.sh

      - name: Create DMG
        run: scripts/create-dmg.sh

      # Signing and notarization require CI secrets — see docs/11-packaging-and-updates.md
      # - run: codesign --deep --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" apps/mac/XBot.app
      # - run: xcrun notarytool submit dist/xBot.dmg --wait --apple-id ... --team-id ... --password ...

      - uses: actions/upload-artifact@v4
        with:
          name: xbot-dmg
          path: dist/xBot.dmg
