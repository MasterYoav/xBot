name: Engine image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - engine/**
      - scripts/build-engine-image.sh
      - scripts/generate-engine-manifest.sh
      - scripts/engine-manifest.template.json
      - scripts/build-engine-manifest.py
      - scripts/read-health-field.py
      # Itself, or a change to how the manifest is built and published never runs. That is how a
      # publish step was added and then never executed once: the placeholder manifest it was meant
      # to replace stayed live.
      - .github/workflows/engine-image.yml

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build xbot/engine and manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # generate-engine-manifest.sh versions the image with `git describe --tags`.
          fetch-depth: 0

      - name: Build engine image
        run: scripts/build-engine-image.sh

      # ghcr rejects an uppercase path, and the owner here is MasterYoav.
      - name: Push to ghcr
        id: push
        run: |
          set -euo pipefail
          repo="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/xbot-engine"
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag xbot/engine:1 "${repo}:latest"
          docker push "${repo}:latest"
          # The digest only exists once the registry has the image, and the pinned digest is
          # the whole point of the manifest — a tag can be moved, a digest cannot.
          digest="$(docker image inspect "${repo}:latest" --format '{{index .RepoDigests 0}}')"
          echo "ref=${digest}" >> "$GITHUB_OUTPUT"

      - name: Generate manifest
        run: scripts/generate-engine-manifest.sh '${{ steps.push.outputs.ref }}' > engine-manifest.json

      # Only from master. A dispatch on a branch would otherwise publish that branch's manifest as
      # the stable one, which is the file every installed app fetches.
      - name: Publish manifest to repo
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp engine-manifest.json manifests/engine-stable.json
          cp engine-manifest.json apps/mac/Sources/XBotApp/Resources/engine-manifest-fallback.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/engine-stable.json apps/mac/Sources/XBotApp/Resources/engine-manifest-fallback.json
          git diff --staged --quiet && exit 0
          git commit -m "CI: update pinned engine manifest"
          # The checkout deliberately does not persist credentials — this job runs `docker build`
          # over repository contents, and a write-scoped token sitting in .git/config for every
          # later step is exactly the thing not to leave lying around. So the token is handed to
          # this one push and nowhere else. Without it the step failed with "could not read
          # Username for https://github.com", so the manifest was never actually published.
          #
          # Rebased and retried, because this job races every other push.
          #
          # It builds an image before it writes the manifest, which takes minutes, and master moves
          # in the meantime. The push is then rejected as non-fast-forward and the whole run goes
          # red having actually succeeded at everything that matters — the image is published and
          # the digest is real; only the commit recording it did not land. The next push then ships
          # an app pinned to the previous digest with nothing saying so.
          #
          # A rebase is safe here in a way it usually is not: this commit touches exactly the two
          # generated manifest files, nothing else in the repository writes them, and the digest it
          # carries was just built from the tree it is being replayed onto.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            if git push "$remote" HEAD:master; then exit 0; fi
            echo "master moved under us; rebasing (attempt $attempt)"
            git pull --rebase "$remote" master || exit 1
          done
          # Three losses in a row is not a race any more, and a silent give-up here is how a stale
          # pin ships.
          echo "Could not publish the manifest after three attempts." >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: engine-manifest
          path: engine-manifest.json
